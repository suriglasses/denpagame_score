<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/result.css">
        <link rel="icon" href="img/favicon.ico">
        <title id="title">スコア</title>
    </head>
    <body>
        <div id="header">
        </div>
        <div id="main_content">
            <div>
                <div id="score_area">
                    <img class="roundel" src="img/roundel.png">
                    <div id="score">
                        test
                    </div>
                </div>
                <div class="pc_visible button_area">
                </div>
            </div>
            <iframe id="ranking"></iframe>
            <div class="phone_visible button_area">
            </div>
        </div>
    </body>
    <script>
        query=new URLSearchParams(window.location.search);
        link="ranking.html";
        first=true;
        date=query.get("date");
        if(date!=null){
            first=false;
            link+=`?date=${date}`
        }
        user_name=query.get("name");
        if(user_name!=null){
            if(first){
                first=false;
                link+="?"
            }else{
                link+="&"
            }
            link+=`name=${user_name}`;
        }
        score=query.get("score");
        if(score!=null){
            if(first){
                first=false;
                link+="?"
            }else{
                link+="&"
            }
            link+=`score=${score}`;
        }
        document.getElementById("score").innerHTML=`name: ${user_name}<br>score: ${score}`
        document.getElementById("ranking").src=link;
        button_content=document.getElementsByClassName("button_area");
        post_text=`"STEEL GRAND PRIX"でスコア: ${score}点を記録しました!\n`;
        post_link="https://denpasai.jp/booths/game-yuushiki-club"
        post_tags="denpasai\n,電波祭\n,電波祭2026\n,steel_grand_prix"
        for (area of button_content) {
            area.innerHTML=`
                <div>
                    <a href=".." class="to_ranking">
                        <div>
                            全体のランキング
                        </div>
                    </a>
                    <a href="https://x.com/intent/post?text=${encodeURIComponent(post_text)}&url=${encodeURIComponent(post_link)}&hashtags=${encodeURIComponent(post_tags)}" class="to_post" target="_blank" rel="noopener noreferrer">
                        <div>
                            <img src="img/x_logo.svg">
                            でポスト
                        </div>
                    </a>
                </div>`
        }
    </script>
    <script src="js/common.js"></script>
</html>
