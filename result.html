<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/result.css">
        <link rel="icon" href="img/favicon.ico">
        <title id="title">スコア</title>
    </head>
    <body>
        <div id="header">
        </div>
        <div id="main_content">
            <div>
                <div id="score_area">
                    <div id="score_content">
                        <div>
                            <div>
                                <div id="name_title">
                                    <div class="title">
                                        Name
                                    </div>
                                </div>
                                <div id="user_name"></div>
                            </div>
                            <div>
                                <div id="tank_title">
                                    <div class="title">
                                        Your Tank
                                    </div>
                                </div>
                                <div id="tank_name"></div>
                            </div>
                            <div>
                                <div id="score_title">
                                    <div class="title">
                                        Score
                                    </div>
                                </div>
                                <div id="user_score"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pc_visible button_area">
                </div>
            </div>
            <div>
                <iframe id="ranking"></iframe>
            </div>
            <div class="phone_visible button_area">
            </div>
        </div>
    </body>
    <script>
        query=new URLSearchParams(window.location.search);
        link="ranking.html";
        first=true;
        tank=query.get("tank");
        if(tank!=null){
            first=false;
            link+=`?tank=${tank}`
            document.getElementById("score_area").style.setProperty("background-image",`url("img/tank/${tank}.png")`)
        }
        user_name=query.get("name");
        if(user_name!=null){
            if(first){
                first=false;
                link+="?"
            }else{
                link+="&"
            }
            link+=`name=${user_name}`;
        }
        score=query.get("score");
        if(score!=null){
            if(first){
                first=false;
                link+="?"
            }else{
                link+="&"
            }
            link+=`score=${score}`;
        }
        document.getElementById("tank_name").innerHTML=`${tank}`
        document.getElementById("user_name").innerHTML=`${user_name}`
        document.getElementById("user_score").innerHTML=`${score}`
        document.getElementById("ranking").src=link;
        button_content=document.getElementsByClassName("button_area");
        post_text=`"STEEL GRAND PRIX"で戦車"${tank}"を使用してスコア: ${score}点を記録しました!\nhttps://denpasai.jp/booths/game-yuushiki-club\n\n#denpasai\n#電波祭\n#電波祭2026\n#steel_grand_prix`;
        for (area of button_content) {
            area.innerHTML=`
                <div>
                    <a href="index.html?name=${user_name}&score=${score}" class="to_ranking">
                        <div>
                            全体のランキング
                        </div>
                    </a>
                    <a href="https://x.com/intent/post?text=${encodeURIComponent(post_text)}" class="to_post" target="_blank" rel="noopener noreferrer">
                        <div>
                            <img src="img/x_logo.svg">
                            でポスト
                        </div>
                    </a>
                </div>`
        }
    </script>
    <script src="js/common.js"></script>
</html>
