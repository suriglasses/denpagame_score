<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/index.css">
        <link rel="icon" href="img/favicon.ico">
        <title id="title">全体のランキング</title>
    </head>
    <body>
        <div id="header">
        </div>
        <div id="main_content">
            <div id="ranking_title">
                全体のランキング
            </div>
            <iframe id="ranking"></iframe>
        </div>
    </body>
    <script>
        query=new URLSearchParams(window.location.search);
        document.getElementById("ranking").src=`ranking.html?tank=${query.get("tank")}&name=${query.get("name")}&hit=${query.get("hit")}&time=${query.get("time")}`
    </script>
    <script src="js/common.js"></script>
</html>
