<!DOCTYPE html>
<html>
    <head>
        <title>ランキング</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="ccs/ranking.css">
        <link rel="icon" href="img/favicon.ico">
    </head>
    <body>
        <div id="main_content">
        </div>
    </body>
    <script>
        function generate_rank_node(data,focus){
            node_id=""
            if(focus==true){
                node_id="id=\"focus_node\""
            }
            node=`
                <div class="rank_node" ${node_id}>
                    <div class="rank">
                        <div>
                            ${data["rank"]}
                        </div>
                    </div>
                    <div class="name">
                        <div>
                            ${data["name"]}
                        </div>
                    </div>
                    <div class="score">
                        <div>
                            ${data["score"]}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("main_content").innerHTML+=node;
        }

        async function ranking_get(date){
            console.log(date)
            link="https://script.google.com/macros/s/AKfycbw2B5XZGTt90auW0d9Z_50qukCmcGyasME0ipnUYTbFFLNDgmQqOzXbGsPEP8lqaWwn6w/exec";
            if(date!=null){
                link+=`?date=${date}`;
            }
            console.log(link);
            data=await (await fetch(link)).json();
            return data;
        }

        async function add_score(name,score,date) {
            data=await (await fetch("https://script.google.com/macros/s/AKfycbw2B5XZGTt90auW0d9Z_50qukCmcGyasME0ipnUYTbFFLNDgmQqOzXbGsPEP8lqaWwn6w/exec",{
                "method":"POST",
                "headers":{
                    "Accept": "text/plain",
                    "Content-Type":"text/plain"
                },
                "body":JSON.stringify({"score":score,"name":name,"date":date})
            })).json();
        }

        query=new URLSearchParams(window.location.search);
        ranking_get(query.get("date")).then(ranking=>{
            if(ranking["error"]!=null){
                document.getElementById("main_content").innerHTML="エラーが発生しました。"
            }
            for(data of ranking){
                focus=false;
                if(data["name"]==query.get("name")){
                    focus=true;
                }
                generate_rank_node(data,focus);
            }
            //画面中央へスクロール
            focus_node=document.getElementById("focus_node");
            if(focus_node!=null){
                console.log(focus_node.scrollTop)
                focus_node.scrollIntoView({"behavior":"smooth","block":"center"});
                focus_node.classList.add("in_window");
            }
        });
    </script>
</html>
