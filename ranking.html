<!DOCTYPE html>
<html>
    <head>
        <title>ランキング</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/ranking.css">
        <link rel="icon" href="img/favicon.ico">
    </head>
    <body>
        <div id="main_content">
            <dev id="loading_message">
                読み込み中...<br>
                少々お待ちください
            </dev>
        </div>
    </body>
    <script src="js/common.js"></script>
    <script>
        function generate_rank_node(data,focus){
            node_id=""
            if(focus==true){
                node_id=" id=\"focus_node\""
            }
            champ_node=""
            switch(data["rank"]){
                case 1:
                    champ_node=" champ_node"
                    break;

                case 2:
                    champ_node=" second_node"
                    break;
                
                case 3:
                    champ_node=" therd_node"
                    break;
            }
            node=`
                <div class="rank_node${champ_node}"${node_id} tabindex=0>
                    <div class="rank">
                        <div>
                            ${data["rank"]}
                        </div>
                    </div>
                    <div class="name" tabindex=-1>
                        <div>
                            ${data["name"]}
                        </div>
                    </div>
                    <div class="score">
                        <div>
                            ${score_value(data["tank"],data["hit"],data["time"])}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("main_content").innerHTML+=node;
        }

        async function ranking_get(target_tank){
            link="https://script.google.com/macros/s/AKfycbwo7B-bEYvn54qOjnajOfAO7sB57yn7hnvWuDRtkDzdS56Z2ABLrOl2WWGOziqwamSTBA/exec";
            if(target_tank!=null){
                link+=`?target_tank=${target_tank}`;
            }
            try{
                data=await (await fetch(link)).json();
            }catch(e){
                document.getElementById("main_content").innerHTML=`
                <dev id="loading_message" class="error">
                    読み込みに失敗しました<br>
                    再読み込みを<br>
                    お試しください
                </dev>
                `;
                console.error(e);
            }
            return data;
        }

        query=new URLSearchParams(window.location.search);
        ranking_get(query.get("target_tank")).then(ranking=>{
            document.getElementById("main_content").innerHTML="";
            if(ranking["error"]!=null){
                console.log(`error: ${ranking["error"]}`);
                document.getElementById("main_content").innerHTML="エラーが発生しました。"
            }else{
                tank=query.get("tank")
                hit=query.get("hit");
                time=query.get("time");
                score=null;
                if(tank!=null&&hit!=null&&time!=null){
                    score=score_value(tank,parseInt(hit),parseInt(time));
                }
                first=true;
                for(data of ranking["value"]){
                    focus=false;
                    if(first&&data["name"]==query.get("name")&&score_value(data["tank"],data["hit"],data["time"])==score){
                        focus=true;
                        first=false;
                    }
                    generate_rank_node(data,focus);
                }
            }
            //画面中央へスクロール
            focus_node=document.getElementById("focus_node");
            if(focus_node!=null){
                focus_node.scrollIntoView({"behavior":"smooth","block":"center"});
                focus_node.classList.add("in_window");
            }
        });
    </script>
</html>
