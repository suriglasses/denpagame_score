<!DOCTYPE html>
<html>
    <head>
        <title>ランキング</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/ranking.css">
        <link rel="icon" href="img/favicon.ico">
    </head>
    <body>
        <div id="main_content">
            <dev id="loading_message">
                読み込み中...<br>
                少々お待ちください
            </dev>
        </div>
    </body>
    <script>
        function generate_rank_node(data,focus){
            node_id=""
            if(focus==true){
                node_id=" id=\"focus_node\""
            }
            champ_node=""
            if(data["rank"]==1){
                champ_node=" champ_node"
            }
            node=`
                <div class="rank_node${champ_node}"${node_id} tabindex=0>
                    <div class="rank">
                        <div>
                            ${data["rank"]}
                        </div>
                    </div>
                    <div class="name" tabindex=-1>
                        <div>
                            ${data["name"]}
                        </div>
                    </div>
                    <div class="score">
                        <div>
                            ${data["score"]}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("main_content").innerHTML+=node;
        }

        async function ranking_get(date){
            link="https://script.google.com/macros/s/AKfycbwo7B-bEYvn54qOjnajOfAO7sB57yn7hnvWuDRtkDzdS56Z2ABLrOl2WWGOziqwamSTBA/exec";
            if(date!=null){
                link+=`?date=${date}`;
            }
            try{
                data=await (await fetch(link)).json();
            }catch(e){
                document.getElementById("main_content").innerHTML=`
                <dev id="loading_message" class="error">
                    読み込みに失敗しました<br>
                    再読み込みを<br>
                    お試しください
                </dev>
                `;
                console.error(e);
            }
            return data;
        }

        async function add_score(name,score,date) {
            data=await (await fetch("https://script.google.com/macros/s/AKfycbwo7B-bEYvn54qOjnajOfAO7sB57yn7hnvWuDRtkDzdS56Z2ABLrOl2WWGOziqwamSTBA/exec",{
                "method":"POST",
                "headers":{
                    "Accept": "text/plain",
                    "Content-Type":"text/plain"
                },
                "body":JSON.stringify({"score":score,"name":name,"date":date})
            })).json();
        }

        query=new URLSearchParams(window.location.search);
        ranking_get(query.get("date")).then(ranking=>{
            document.getElementById("main_content").innerHTML="";
            if(ranking["error"]!=null){
                console.log(`error: ${ranking["error"]}`);
                document.getElementById("main_content").innerHTML="エラーが発生しました。"
            }else{
                first=true;
                for(data of ranking["value"]){
                    focus=false;
                    if(first&&data["name"]==query.get("name")&&data["score"]==parseInt(query.get("score"))){
                        focus=true;
                        first=false;
                    }
                    generate_rank_node(data,focus);
                }
            }
            //画面中央へスクロール
            focus_node=document.getElementById("focus_node");
            if(focus_node!=null){
                focus_node.scrollIntoView({"behavior":"smooth","block":"center"});
                focus_node.classList.add("in_window");
            }
        });
    </script>
</html>
